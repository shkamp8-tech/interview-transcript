<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview — Mingus (Peter Hopman)</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        /* ─── Theme variables ─── */
        :root {
            --bg: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-bar: rgba(255,255,255,0.92);
            --text: #1a1a2e;
            --text-muted: #666;
            --text-dim: #999;
            --border: #e0e0e8;
            --accent: #6c63ff;
            --accent-light: rgba(108,99,255,0.08);
            --accent-active: rgba(108,99,255,0.15);
            --s1: #2563eb;
            --s1-bg: #eff6ff;
            --s1-text: #1d4ed8;
            --s2: #d97706;
            --s2-bg: #fffbeb;
            --s2-text: #b45309;
            --divider-bg: var(--bg);
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        [data-theme="dark"] {
            --bg: #0f0f1a;
            --bg-secondary: #161630;
            --bg-bar: rgba(22,22,48,0.94);
            --text: #e0e0ee;
            --text-muted: #888;
            --text-dim: #555;
            --border: #222250;
            --accent: #6c63ff;
            --accent-light: rgba(108,99,255,0.06);
            --accent-active: rgba(108,99,255,0.14);
            --s1: #5bb8f5;
            --s1-bg: #0d1f33;
            --s1-text: #5bb8f5;
            --s2: #f5a623;
            --s2-bg: #2a1f08;
            --s2-text: #f5a623;
            --divider-bg: #0f0f1a;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .page { max-width: 780px; margin: 0 auto; padding: 16px 20px 80px; }

        /* ─── Header ─── */
        .hdr { text-align: center; padding: 32px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; position: relative; }
        .hdr h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg,#6c63ff,#a855f7); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
        .hdr .sub { font-size: 1rem; color: var(--text-muted); line-height: 1.6; }
        .hdr .sub strong { color: var(--text); }
        .hdr .date { margin-top: 6px; font-size: 0.85rem; color: var(--text-dim); }

        /* Theme toggle */
        .theme-btn {
            position: absolute; top: 32px; right: 0;
            background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 50%;
            width: 40px; height: 40px; cursor: pointer; font-size: 1.3rem;
            color: var(--text); display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; z-index: 10;
        }
        .theme-btn:hover { border-color: var(--accent); transform: scale(1.1); background: var(--accent-light); }

        /* ─── Legend ─── */
        .legend { display: flex; gap: 24px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-muted); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .legend-dot.c1 { background: var(--s1); }
        .legend-dot.c2 { background: var(--s2); }

        /* ─── Audio bar ─── */
        .audio-bar {
            background: var(--bg-bar); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 16px; margin-bottom: 16px;
            position: sticky; top: 6px; z-index: 20;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }
        .drop-label { color: var(--text-dim); font-size: 0.85rem; cursor: pointer; padding: 10px; display: block; text-align: center; }
        .drop-label:hover { color: var(--accent); }
        .drop-label strong { color: var(--text-muted); }
        #audioFile { display: none; }
        audio { width: 100%; height: 40px; border-radius: 8px; }
        .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
        .controls span { font-size: 0.75rem; color: var(--text-dim); }
        .sbtn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; transition: all 0.15s; }
        .sbtn:hover { border-color: var(--accent); color: var(--text); }
        .sbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
        .toggle { margin-left: auto; display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .tbtn { padding: 5px 14px; font-size: 0.75rem; border: none; background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
        .tbtn.on { background: var(--accent); color: #fff; }
        .player-wrap { display: none; }
        .player-wrap.show { display: block; }

        /* ─── Blocks ─── */
        .block {
            display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 16px; margin-bottom: 4px;
            border-radius: 8px; border-left: 3px solid transparent;
            cursor: pointer; transition: background 0.15s;
        }
        .block:hover { background: var(--accent-light); }
        .block.active { background: var(--accent-active); }
        .block.s1 { border-left-color: var(--s1); }
        .block.s2 { border-left-color: var(--s2); }
        .block.hid { display: none; }

        .block-meta { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px; padding-top: 2px; }
        .block-time { font-size: 0.68rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
        .block-spk { font-size: 0.62rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
        .block.s1 .block-spk { background: var(--s1-bg); color: var(--s1-text); }
        .block.s2 .block-spk { background: var(--s2-bg); color: var(--s2-text); }

        .block-body { flex: 1; min-width: 0; }
        .block-text { font-size: 0.9rem; line-height: 1.7; }
        .block-note { margin-top: 6px; font-size: 0.78rem; color: var(--text-dim); font-style: italic; }
        .block-note::before { content: '\2192  '; }

        /* ─── Divider ─── */
        .divider { text-align: center; margin: 28px 0; position: relative; }
        .divider::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--border); }
        .divider span { position: relative; background: var(--divider-bg); padding: 0 16px; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .divider.hid { display: none; }

        /* ─── Footer ─── */
        .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; font-size: 0.75rem; color: var(--text-dim); }

        @media (max-width: 600px) {
            .page { padding: 8px 12px 60px; }
            .hdr h1 { font-size: 1.4rem; }
            .block { gap: 10px; padding: 10px 12px; }
            .block-meta { min-width: 36px; }
            .block-text { font-size: 0.84rem; }
            .sbtn { padding: 3px 8px; font-size: 0.68rem; }
            .tbtn { padding: 4px 10px; font-size: 0.68rem; }
            .theme-btn { top: 24px; }
        }

        /* ─── Access Code Screen ─── */
        .gate-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.4s, visibility 0.4s;
        }
        .gate-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .gate-card {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 20px; padding: 48px 40px 40px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            text-align: center; max-width: 420px; width: 90%;
        }
        [data-theme="dark"] .gate-card { box-shadow: 0 8px 40px rgba(0,0,0,0.35); }
        .gate-title {
            font-size: 0.85rem; font-weight: 700; letter-spacing: 3px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 32px;
        }
        .gate-inputs {
            display: flex; gap: 14px; justify-content: center; margin-bottom: 32px;
        }
        .gate-input {
            width: 68px; height: 76px; border-radius: 14px;
            border: 2px solid var(--border); background: var(--bg);
            font-size: 1.8rem; font-weight: 700; text-align: center;
            color: var(--text); outline: none; caret-color: var(--accent);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .gate-input:focus {
            border-color: #5b8def;
            box-shadow: 0 0 0 4px rgba(91,141,239,0.15);
        }
        .gate-input.shake {
            animation: shake 0.4s ease;
        }
        .gate-hint {
            font-size: 0.82rem; color: var(--text-dim);
        }
        .gate-error {
            color: #e74c3c; font-size: 0.82rem; margin-top: 8px;
            opacity: 0; transition: opacity 0.3s;
        }
        .gate-error.show { opacity: 1; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>

<script>
// ─── Access Code Gate ───
(function() {
    var CODE = '0003';
    var overlay = document.getElementById('gateOverlay');
    var mainPage = document.getElementById('mainPage');
    var inputs = document.querySelectorAll('#gateInputs .gate-input');
    var errorEl = document.getElementById('gateError');

    // Check if already authenticated
    try { if (sessionStorage.getItem('authed') === '1') { unlock(); return; } } catch(e) {}

    inputs[0].focus();

    inputs.forEach(function(inp, i) {
        inp.addEventListener('input', function() {
            inp.value = inp.value.replace(/[^0-9]/g, '');
            if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
            if (i === inputs.length - 1 && inp.value) checkCode();
        });
        inp.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !inp.value && i > 0) {
                inputs[i - 1].focus();
                inputs[i - 1].value = '';
            }
        });
        // Allow paste of full code
        inp.addEventListener('paste', function(e) {
            e.preventDefault();
            var data = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
            for (var j = 0; j < inputs.length && j < data.length; j++) {
                inputs[j].value = data[j];
            }
            if (data.length >= inputs.length) checkCode();
            else if (data.length > 0) inputs[Math.min(data.length, inputs.length - 1)].focus();
        });
    });

    function checkCode() {
        var entered = '';
        inputs.forEach(function(inp) { entered += inp.value; });
        if (entered === CODE) {
            try { sessionStorage.setItem('authed', '1'); } catch(e) {}
            unlock();
        } else {
            errorEl.classList.add('show');
            inputs.forEach(function(inp) { inp.classList.add('shake'); inp.value = ''; });
            setTimeout(function() {
                inputs.forEach(function(inp) { inp.classList.remove('shake'); });
                inputs[0].focus();
            }, 400);
            setTimeout(function() { errorEl.classList.remove('show'); }, 2000);
        }
    }

    function unlock() {
        overlay.classList.add('hidden');
        mainPage.style.display = '';
        setTimeout(function() { overlay.remove(); }, 500);
    }
})();

var segments = [
  {s:0,e:5,spk:1,imp:false,text:"Hello, I don’t know how loud we should talk."},
  {s:5,e:9,spk:2,imp:false,text:"I usually talk loud, so that’s fine."},
  {s:9,e:10,spk:1,imp:false,text:"That’s me, right?"},
  {s:10,e:12,spk:2,imp:false,text:"Yes, that’s right."},
  {s:12,e:14,spk:1,imp:false,text:"Can I say it in English?"},
  {s:14,e:15,spk:2,imp:false,text:"Sure."},
  {s:15,e:22,spk:1,imp:true,text:"Okay, so, then I will start with the questions immediately. Do you work harder from something simple and build that up to something complex, or the other way around?"},
  {s:35,e:40,spk:2,imp:true,text:"Can you rephrase the question again?"},
  {s:41,e:57,spk:1,imp:true,text:"So, if you design something, go from something simple and make that more difficult or complex, or have something that is very complex and build that down to something simple?"},
  {s:57,e:111,spk:2,imp:true,text:"I don’t think that’s the case. I think the case is always that if I have a design thought or I need to think about a concept, I immediately start by organizing all the parameters where I need to refer my concept to. And I would never go to make anything more complex. So, I’m always searching for clarity and for simplicity in a sense of making it as clear as possible, as simple as possible. And by making it as simple as possible, a lot of people will understand it as well. Because if you create something very complex, it’s harder to understand."},
  {s:112,e:117,spk:1,imp:false,text:"Okay."},
  {s:118,e:154,spk:2,imp:true,text:"No, but this is, I think in that question, it also depends on the question itself, on the design question itself. I don’t know if you can, you cannot say that there’s only one direction, there’s only one truth. It’s always, so even a design question on its own is a complex one. But I’m, as a designer, always bringing it back to clarity, to making it just, okay, what do we have? What’s the question? What kind of materials can I need? All those things, all the parameters around it."},
  {s:155,e:159,spk:1,imp:true,text:"So, it’s more thoughts in parameters than dividing?"},
  {s:160,e:174,spk:2,imp:true,text:"It’s about clarity, getting the things clear for yourself and also making it in towards the program of wishes, to get that clear, and then you know, now I can start."},
  {s:175,e:181,spk:1,imp:false,text:"Okay. So, yeah. Yeah. One moment."},
  {s:182,e:198,spk:1,imp:true,text:"Have you ever started with a project and midway to the project you thought it needs to be completely different?"},
  {s:199,e:274,spk:2,imp:true,text:"What I can tell is that sometimes it happens, but that is really at the start of a project. Let’s say somebody comes to me and asks if I can design a chair for them. And then I go there and have this interview with them and I talk about, okay, why? Why do you want to have a chair? And maybe it will end up that I will design a kitchen for them or an extension of their house instead of designing the chair. And that has to do with me as a designer just asking the questions. Yeah, but why? Why do you think you need the chair? And then they say, yeah, because I want this and this. Okay, but it’s probably it’s more about enjoying food or making food or whatever. So, and, you know, from that conversation, it ends up in a complete other solution and another design, which they thought will ask him for designing a chair. But having the conversation with your client, it can also just become something else."},
  {s:275,e:279,spk:1,imp:true,text:"So, true conversation and mostly the question why?"},
  {s:280,e:282,spk:2,imp:true,text:"Yeah, that is the start overall."},
  {s:283,e:304,spk:1,imp:true,text:"Okay. Yeah. Do you try to keep the original identity of something that you start from?"},
  {s:305,e:306,spk:2,imp:false,text:"I don’t get that one."},
  {s:307,e:326,spk:1,imp:true,text:"If you design something or you need to reform it or translate to something different, do you try to keep the original identity of your first idea, concept, object?"},
  {s:327,e:349,spk:2,imp:true,text:"No, that also is, it’s very depending on the question and on the start of, for example, an existing design you have. And if somebody comes up with a question which is related to that design, I would redesign it towards the wishes of the client, for example."},
  {s:350,e:354,spk:1,imp:true,text:"So, the client goes first."},
  {s:355,e:405,spk:2,imp:true,text:"It depends. If it’s my own design and I want to produce it myself, for example, then I’m the client. I’m my own client. But if there’s a client who says, I really enjoyed, again, let’s say this chair, I think it’s a beautiful chair, but, you know, I’m more looking towards this or this or this, and using this material. I would say, okay, I’m very happy that you’re here because you like my chair, but I’m going to design another chair for you based upon what you really want. And that could be a starting point. The chair could be a starting point or not. It depends on what I’m thinking or what would be the best to provide the client of a good design."},
  {s:406,e:423,spk:1,imp:false,text:"I’m starting to understand it more. Yeah. I need to change my questions a little bit."},
  {s:424,e:425,spk:2,imp:false,text:"That’s fine."},
  {s:436,e:457,spk:1,imp:true,text:"Through the conversations you have with clients or for your own design, how do you decide which details can be sacrificed or need to stay?"},
  {s:458,e:503,spk:2,imp:true,text:"That, again, is based on the conversation. And also, you can design something, but if it’s very difficult to produce because the machines cannot do it or it’s too expensive, all those things, there are a lot of things which are important by designing something. And it also needs to be produced in a suitable way. And it depends if it’s mass production or if it’s just a single one. There’s a big priority in that. So it’s also difficult to answer."},
  {s:504,e:506,spk:1,imp:true,text:"If it is for yourself, a project for your own."},
  {s:507,e:558,spk:2,imp:true,text:"I would. But then again, for myself, I have some machines and I can do stuff and I can just ask companies to make, let’s say, parts of a design. But it’s the same because if I don’t have the money, I need to find something else to make it work. And so, be smart as well, being smart in designing it instead of just making a design which is very expensive to make, for example. I think it’s also very interesting to search in the possibilities of production or money or those things."},
  {s:559,e:560,spk:1,imp:true,text:"Finding the limits of the money."},
  {s:561,e:571,spk:2,imp:true,text:"The limits, yeah, the limits and the possibilities. But still, you’re still able to finalize the design you want."},
  {s:588,e:599,spk:1,imp:true,text:"Yeah. Did you ever change something small in your design and that completely changes the whole project?"},
  {s:600,e:604,spk:2,imp:true,text:"No."},
  {s:605,e:605,spk:1,imp:false,text:"No?"},
  {s:606,e:606,spk:2,imp:false,text:"No."},
  {s:607,e:619,spk:1,imp:true,text:"Okay. And are there reoccurring themes or details that just keeps coming back with every project?"},
  {s:620,e:672,spk:2,imp:true,text:"Yeah, a lot of my designs, they have a double function. So it’s that often I design a product which has a double function. So it’s not only a chair, but it can also do this, or it’s not only a lamp, but you can also plug in a plug for electricity, or it’s not only a table, but it’s also a big vase to put a tree in, you know. So there’s also, and I think that’s interesting because then the design itself gets a new meaning and a new identity instead of being the 10 millionth design of a chair on its own. So that’s, in my work, something which is constant."},
  {s:673,e:679,spk:1,imp:true,text:"And then you find more a balance between those two functions, or does it need to have a sort of friction between them?"},
  {s:680,e:703,spk:2,imp:true,text:"No, there’s no friction. There’s harmony and there’s joy. It’s fun. So there’s a lot of people who see my designs where there’s this double function. They become happy and they have something like, wow, that’s nice, you know. It makes me happy to see this. And no, there’s no friction."},
  {s:704,e:729,spk:1,imp:true,text:"Okay. And with that approach, did some of your projects maybe end up completely in a different place or a different function than you thought it would be?"},
  {s:730,e:869,spk:2,imp:true,text:"Well, sometimes there are, that’s what I like. And especially by, I also did architecture and kind of the bigger things. And I designed this pole in Mexico to capture the lightning. And it was a pole of 15 meters high. And there’s a copper wire inside and it will go in the ground. And when the lightning hits the pole, then you will get this glass sculpture in the ground, in the sand underneath. So it’s a lightning catcher. But when I managed to put this in, it was in Mexico this last, around Christmas. And then we had the pole standing with six wires, just was standing there 15 meters high. And there was this bird of prey just coming there and sitting on top of the pole. And that was his new spot. And those are things you cannot render, you cannot think about. But so these are presents, you know, these are presents of something. And then you’re like, wow, that’s nice. Now it’s being used also for the bird to have, you know, like this lookout. And then I think that’s just a gift. That’s a gift. And I also designed one time a ship and I made 240 holes in the complete ship. And then when the ship was placed on its final spot and I was sitting at the other side, I can see people walking in the ship. And I didn’t know that, because I did not render or did not make my technical drawing with moving people in it. But then I can just see people walking, because it was so transparent by all the holes in the ship. It was beautiful. So again, a present, which you, well, you do not know, you know, when you have designed something or made something. And then there’s always a surprise, or, you know, and maybe a disappointment. I can’t remember a disappointment, but probably it would be there as well."},
  {s:870,e:874,spk:1,imp:true,text:"Do you then also make a new design from the presents you get?"},
  {s:875,e:883,spk:2,imp:true,text:"No, no, no, no, no, no. It’s just, no, it’s just, it’s a gift."},
  {s:884,e:909,spk:1,imp:true,text:"Okay. The combining of the two functions in a design, is that more based on some rules or more a natural feeling?"},
  {s:910,e:911,spk:2,imp:false,text:"Can you do it again?"},
  {s:912,e:928,spk:1,imp:true,text:"If you design something that has two functions, is it then how you combine them, based on rules or more a feeling?"},
  {s:929,e:960,spk:2,imp:true,text:"No, there are no rules. It’s a creative insight. The only thing, the rules are, is the functionality. That’s a given rule. It needs to work, you know, it needs to function. That’s a given rule, you know."},
  {s:961,e:984,spk:1,imp:false,text:"Yeah. I think that’s the case, yeah. Okay. Well, these are the questions I prepared."},
  {s:985,e:988,spk:2,imp:false,text:"Really? Damn."},
  {s:989,e:992,spk:1,imp:false,text:"Well, okay. Well, I hope you have. Well, is it good enough?"},
  {s:993,e:996,spk:2,imp:false,text:"I hope so. How many interviews do you need to get to?"},
  {s:997,e:1000,spk:1,imp:false,text:"Well, at least one. You’re the first."},
  {s:1001,e:1006,spk:2,imp:false,text:"Yeah. So, maybe I need to find someone. It would be, it would be, yeah."},
  {s:1007,e:1010,spk:1,imp:false,text:"It’s really the first time I’m doing an interview."},
  {s:1011,e:1054,spk:2,imp:false,text:"Yeah? So, I don’t know how... And, well, maybe we can, you know, in the end, I think it’s good to have those questions. It seems as if you’re sending it somewhere or something, that you already have a kind of pre-designed idea, you know. What you said about, yeah, this or that, while I think, no, it works very differently for me. It’s a totally different approach. So I don’t know what you want to get out of it. That’s a bit of the question. Because of what you said, which wasn’t clear, so it’s interesting, because it’s actually very much about a kind of personal design process and how you approach things. So I would focus on that a bit more, you know? If you try to see how... And it’s very difficult, of course, to do, because for me, ideas just arise, you know? They’re kind of like, okay, I see this, I think, oh, that would be cool. And sometimes there’s a very high dose of humor in it. You know? But often it is with my designs that there is really that double function, quite often."},
  {s:1055,e:1069,spk:1,imp:false,text:"Yeah. I’m still looking for myself a little bit, but... Yeah."},
  {s:1070,e:1097,spk:2,imp:false,text:"Can you see my site here? Bureau Lakenvelder. Ahem. It’s a bit slow, isn’t it? Yeah, it’s connected to my hotspot, because it’s connected to the school."},
  {s:1098,e:1118,spk:2,imp:false,text:"I think that’s... Yeah, that’s a double function. You see? It’s a framework that... It’s for a construction company. Let’s see here."},
  {s:1119,e:1154,spk:2,imp:false,text:"This, for example, this is a company, and this looks like a cabinet, so to speak. But it’s a mailbox, so to speak. As you can see here, it’s actually a kind of hanging dressing cabinet. If you open it, it’s a mailbox. You can get all your mail out of it. So I think it’s nice that it presents itself as a hanging cabinet, but they’re actually just the mailboxes."},
  {s:1155,e:1163,spk:2,imp:false,text:"And another example of this is... This is a nice double function."},
  {s:1164,e:1165,spk:1,imp:false,text:"It’s a ladder right away."},
  {s:1166,e:1180,spk:2,imp:false,text:"Yes, it’s the ladder, but it’s also the double function so you don’t fall out. And there are six lodging spots. So it immediately gives an image, you know, of which you think, oh yeah."},
  {s:1181,e:1210,spk:2,imp:false,text:"Look at that cupboard. There’s a double function in there. Well, more about how you... No, this is very functional. This is for the design museum in Den Bosch. It contains the ceramic work. Here are the lamps to feel it. It’s also a room divider, so it’s a bit of a double function in there."},
  {s:1212,e:1226,spk:2,imp:false,text:"But this is also a double function, actually. It’s just a desk, but also to call. There’s a ball in there. And what you can do is..."},
  {s:1227,e:1230,spk:1,imp:false,text:"When did you actually start with the double function?"},
  {s:1231,e:1255,spk:2,imp:false,text:"Here, this is a very clear double function: a tree and a desk. When I graduated... Let’s see, because I’m going back to my old job now. This is also a double function: a laptop bag. When you open that flap, it’s your mouse pad, but it’s also your bag that you take with you. This is a very clear one. This is a power point. And this is a light bulb and a socket to plug in. So that’s a double function again. So it’s light and electricity. You see, in a way, it just comes back a lot in my work."},
  {s:1273,e:1295,spk:2,imp:false,text:"Storage. This was for the Expo 2000 in Hanover. The World Expo. These are containers to store things. Products that were sold, but you rolled it together and it immediately became the desk. So it’s also a combination of storage and a desk. So there are a lot of things that kind of return as a double function."},
  {s:1299,e:1324,spk:2,imp:false,text:"This was the ship. Here’s that ship with all those holes in it. If you walked to the other side, you saw people walking through the ship. Wait, look. See, there’s a kind of transparency in it. It’s cool, isn’t it? 240 holes in it."},
  {s:1326,e:1332,spk:1,imp:false,text:"Yeah. Yeah, it’s a cool assignment."},
  {s:1333,e:1379,spk:2,imp:false,text:"Yeah, so that’s kind of the... Yeah, this is actually... My grandfather was shot dead in the war. They threw him in a ditch. Together with another man from the village, they just killed him. In Rotterdam, in a cellar. And then they threw him in that ditch. So this is a shovel, with a cross on top. See? If you stand there, you can see it. So this is also a cross, a shovel, you know. So it’s kind of double..."},
  {s:1380,e:1390,spk:1,imp:false,text:"Never looked or never visited, why?"},
  {s:1391,e:1417,spk:2,imp:false,text:"Well, I think I know where it’s coming from. Because if you introduce a double function, then it suddenly gets a new identity, a new function. So if that chair also offers space to store something or whatever, then it’s not just that chair, but it also has that other function."},
  {s:1419,e:1493,spk:2,imp:false,text:"Which would make people say, hey, that’s interesting. I can use it well. But for example, that table I designed with that tree in it. It’s called a table pot. But then you’re always under your own tree. So I designed it for a company. Suppose I have a company and I have all those tables, and you come to work with me. Then the first thing I do is I go to a good garden center with you and we’re going to buy a nice tree. And that will be your tree. And you’re going to take care of that tree, because this is your office. Well, I think that’s a nice story. So there are often stories attached to it. And that’s why that table is just a cool table. It floats, you know. It’s a nice image, so it’s an image-enhancing thing. And it has that beautiful function that you’re also working under a tree."},
  {s:1495,e:1498,spk:1,imp:true,text:"Okay. Yes! Thank you very much for your time."},
  {s:1499,e:1503,spk:2,imp:true,text:"You’re welcome. And good luck!"}
];

var dividerDefs = [
    {before: 961, text: "End of formal interview", imp: false},
    {before: 1070, text: "Showing portfolio \u2014 Bureau Lakenvelder", imp: false},
    {before: 1495, text: "\u2022 \u2022 \u2022", imp: true}
];

var ap = document.getElementById('ap');
var tr = document.getElementById('transcript');
var mode = 1; // 0=all, 1=important
var activeEl = null;

function fmt(sec) {
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
}

// Build transcript blocks
var dividerMap = {};
dividerDefs.forEach(function(d) { dividerMap[d.before] = d; });

segments.forEach(function(seg) {
    if (dividerMap[seg.s]) {
        var dd = dividerMap[seg.s];
        var dv = document.createElement('div');
        dv.className = 'divider' + (mode === 1 && !dd.imp ? ' hid' : '');
        dv.dataset.imp = dd.imp ? '1' : '0';
        dv.innerHTML = '<span>' + dd.text + '</span>';
        tr.appendChild(dv);
    }

    var el = document.createElement('div');
    el.className = 'block s' + seg.spk + (mode === 1 && !seg.imp ? ' hid' : '');
    el.dataset.s = seg.s;
    el.dataset.e = seg.e;
    el.dataset.imp = seg.imp ? '1' : '0';

    var html = '<div class="block-meta">';
    html += '<span class="block-time">' + fmt(seg.s) + '</span>';
    html += '<span class="block-spk">' + (seg.spk === 1 ? 'Sarr\u00f3n' : 'Mingus') + '</span>';
    html += '</div>';
    html += '<div class="block-body"><div class="block-text">' + seg.text.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>';
    if (seg.note) html += '<div class="block-note">' + seg.note.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>';
    html += '</div>';
    el.innerHTML = html;

    el.addEventListener('click', function() {
        if (ap.src) { ap.currentTime = seg.s; ap.play(); }
    });

    tr.appendChild(el);
});

// Audio file loading
var dropLabel = document.getElementById('dropLabel');
var playerWrap = document.getElementById('playerWrap');
var fileInput = document.getElementById('audioFile');
var audioBar = document.getElementById('audioBar');

// Auto-load hosted audio file
ap.src = 'Interview%20Mingus.m4a';
dropLabel.style.display = 'none';
playerWrap.classList.add('show');

function loadAudio(file) {
    var url = URL.createObjectURL(file);
    ap.src = url;
    dropLabel.style.display = 'none';
    playerWrap.classList.add('show');
}

fileInput.addEventListener('change', function() {
    if (fileInput.files.length) loadAudio(fileInput.files[0]);
});

audioBar.addEventListener('dragover', function(e) { e.preventDefault(); dropLabel.style.color = 'var(--accent)'; });
audioBar.addEventListener('dragleave', function() { dropLabel.style.color = ''; });
audioBar.addEventListener('drop', function(e) {
    e.preventDefault();
    dropLabel.style.color = '';
    if (e.dataTransfer.files.length) loadAudio(e.dataTransfer.files[0]);
});

// Speed buttons
document.querySelectorAll('.sbtn').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var s = parseFloat(btn.dataset.s);
        ap.playbackRate = s;
        document.querySelectorAll('.sbtn').forEach(function(b) { b.classList.toggle('on', parseFloat(b.dataset.s) === s); });
    });
});

// Toggle All / Important
document.getElementById('btAll').addEventListener('click', function() { setMode(0); });
document.getElementById('btImp').addEventListener('click', function() { setMode(1); });

function setMode(m) {
    mode = m;
    document.getElementById('btAll').classList.toggle('on', m === 0);
    document.getElementById('btImp').classList.toggle('on', m === 1);
    tr.querySelectorAll('.block').forEach(function(el) {
        el.classList.toggle('hid', m === 1 && el.dataset.imp !== '1');
    });
    tr.querySelectorAll('.divider').forEach(function(el) {
        el.classList.toggle('hid', m === 1 && el.dataset.imp !== '1');
    });
}

// Sync: highlight active block
ap.addEventListener('timeupdate', function() {
    var t = ap.currentTime;
    var found = null;
    var blocks = tr.querySelectorAll('.block');
    for (var i = 0; i < blocks.length; i++) {
        var el = blocks[i];
        if (!el.classList.contains('hid') && t >= parseFloat(el.dataset.s) && t <= parseFloat(el.dataset.e)) {
            found = el;
            break;
        }
    }
    if (found !== activeEl) {
        if (activeEl) activeEl.classList.remove('active');
        if (found) {
            found.classList.add('active');
            found.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        activeEl = found;
    }
});

// Skip non-important in Important mode
ap.addEventListener('timeupdate', function() {
    if (mode !== 1) return;
    var t = ap.currentTime;
    var inImportant = false;
    for (var i = 0; i < segments.length; i++) {
        if (segments[i].imp && t >= segments[i].s && t <= segments[i].e) {
            inImportant = true;
            break;
        }
    }
    if (!inImportant && !ap.paused) {
        var next = null;
        for (var i = 0; i < segments.length; i++) {
            if (segments[i].imp && segments[i].s > t) {
                next = segments[i];
                break;
            }
        }
        if (next) ap.currentTime = next.s;
        else ap.pause();
    }
});

// Theme toggle
var themeBtn = document.getElementById('themeBtn');
function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.innerHTML = t === 'dark' ? '&#9788;' : '&#9790;';
}
themeBtn.addEventListener('click', function() {
    var cur = document.documentElement.getAttribute('data-theme');
    setTheme(cur === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
